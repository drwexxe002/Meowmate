<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login MeowMate (Demo)</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
<div class="container" style="max-width:420px;padding-top:90px;padding-bottom:40px">
  <div class="card p-4">
    <h4 class="mb-3" id="judulLogin">Login</h4>
    <div class="alert alert-warning small" id="infoDemo"></div>
    <form id="formLogin" novalidate>
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input id="loginUser" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Kata sandi</label>
        <input id="loginSandi" type="password" class="form-control" required>
      </div>
      <div id="pesanLogin" class="text-danger small mb-2"></div>
      <button class="btn btn-meow w-100" type="submit">Masuk</button>
    </form>
    <a id="tautanGanti" class="d-block text-center mt-3 small" href="#"></a>
    <a href="index.html" class="d-block text-center mt-2 small">← Kembali ke website</a>
  </div>
</div>

<script>
const akun = {
  admin:    { user: 'admin', sandi: 'admin123', tujuan: 'admin.html' },
  pengguna: { user: 'user',  sandi: 'user123',  tujuan: 'index.html' }
};

const param = new URLSearchParams(location.search).get('peran');
const peran = param === 'admin' ? 'admin' : 'pengguna';
const data = akun[peran];
const lain = peran === 'admin' ? 'pengguna' : 'admin';

document.getElementById('judulLogin').textContent = peran === 'admin' ? 'Login Admin' : 'Login Pengguna';
document.getElementById('infoDemo').innerHTML =
  '<b>Mode demo.</b> Username: <b>' + data.user + '</b>, kata sandi: <b>' + data.sandi + '</b>';
const ganti = document.getElementById('tautanGanti');
ganti.href = 'login.html?peran=' + lain;
ganti.textContent = peran === 'admin' ? 'Masuk sebagai pengguna' : 'Masuk sebagai admin';

document.getElementById('formLogin').addEventListener('submit', function (e) {
  e.preventDefault();
  const u = document.getElementById('loginUser').value.trim().toLowerCase();
  const s = document.getElementById('loginSandi').value;

  if (u !== data.user || s !== data.sandi) {
    document.getElementById('pesanLogin').textContent = 'Username atau kata sandi salah.';
    return;
  }
  sessionStorage.setItem('meowmatePeran', peran);
  location.href = data.tujuan;
});
</script>
</body>
</html>
